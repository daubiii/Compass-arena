<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Compass Arena — Админ-панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0d12;
            --panel: #10141b;
            --panel-2: #151a22;
            --line: #242b35;
            --gold: #c9a35a;
            --gold-bright: #e3c48a;
            --text: #eae6da;
            --text-muted: #97a0ac;
            --text-dim: #5f6773;
            --green: #4caf50;
            --red: #e74c3c;
            --blue: #3498db;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            padding: 20px 0 60px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* HEADER */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 30px;
        }
        .admin-header h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 22px;
            font-weight: 500;
        }
        .admin-header h1 em { color: var(--gold); font-style: normal; }
        .admin-header .back {
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            border: 1px solid var(--line);
            padding: 6px 16px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .admin-header .back:hover {
            border-color: var(--gold);
            color: var(--gold-bright);
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 24px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: 'Unbounded', sans-serif;
            font-size: 12px;
            letter-spacing: 0.04em;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }
        .tab:hover { color: var(--text); }
        .tab.active {
            color: var(--gold-bright);
            border-bottom-color: var(--gold);
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* CARDS */
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 20px 24px;
            margin-bottom: 16px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }
        .card-header h3 {
            font-family: 'Unbounded', sans-serif;
            font-size: 16px;
            font-weight: 500;
        }

        /* FORM */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .form-group input, .form-group select {
            background: var(--bg);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--gold);
        }
        .form-group input::placeholder {
            color: var(--text-dim);
        }

        /* BUTTONS */
        .btn {
            padding: 8px 20px;
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--gold-bright);
            border-radius: 4px;
            font-family: 'Unbounded', sans-serif;
            font-size: 11px;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: var(--gold); color: var(--bg); }
        .btn-primary { background: var(--gold); color: var(--bg); }
        .btn-primary:hover { background: var(--gold-bright); }
        .btn-danger { border-color: var(--red); color: var(--red); }
        .btn-danger:hover { background: var(--red); color: #fff; }
        .btn-sm { padding: 4px 12px; font-size: 10px; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

        /* TEAM LIST */
        .team-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        .team-item {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .team-item:hover { border-color: var(--gold); }
        .team-item .info { display: flex; flex-direction: column; gap: 2px; }
        .team-item .info .name { font-size: 14px; font-weight: 500; }
        .team-item .info .players { font-size: 12px; color: var(--text-dim); }
        .team-item .actions { display: flex; gap: 6px; }

        /* MATCH LIST */
        .match-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .match-item {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .match-item .teams {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .match-item .teams .vs { color: var(--text-dim); font-size: 12px; }
        .match-item .teams .winner { color: var(--gold-bright); font-weight: 600; }
        .match-item .meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-dim);
        }
        .match-item .meta .bracket-tag {
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }
        .match-item .meta .bracket-tag.upper { background: rgba(201,163,90,0.2); color: var(--gold); }
        .match-item .meta .bracket-tag.lower { background: rgba(179,105,95,0.2); color: var(--oxblood-bright); }
        .match-item .meta .bracket-tag.grand { background: rgba(201,163,90,0.3); color: var(--gold-bright); }

        /* MODAL OVERLAY */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--panel);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 28px 32px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
        }
        .modal-close:hover { color: var(--text); }
        .modal h2 {
            font-family: 'Unbounded', sans-serif;
            font-size: 18px;
            margin-bottom: 16px;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--panel);
            border: 1px solid var(--gold);
            padding: 12px 24px;
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* RESPONSIVE */
        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
            .form-row.three { grid-template-columns: 1fr; }
            .admin-header h1 { font-size: 18px; }
            .team-list { grid-template-columns: 1fr; }
            .match-item { flex-direction: column; align-items: stretch; }
            .match-item .teams { justify-content: center; }
            .match-item .meta { justify-content: center; }
        }
    </style>
</head>
<body>
<script>
    // ⚠️ ИЗМЕНИТЕ ЭТОТ ПАРОЛЬ!
    const ADMIN_PASSWORD = "ebat";

    function checkPassword() {
        const input = prompt("🔐 Введите пароль администратора:");
        if (input !== ADMIN_PASSWORD) {
            document.body.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0d12;color:#e74c3c;font-family:sans-serif;flex-direction:column;gap:16px;">
                    <h1 style="font-size:48px;">⛔</h1>
                    <h2>Доступ запрещён</h2>
                    <p style="color:#97a0ac;">Неверный пароль администратора</p>
                    <button onclick="location.reload()" style="padding:10px 30px;background:#c9a35a;border:none;border-radius:4px;color:#0a0d12;cursor:pointer;font-size:16px;">Попробовать снова</button>
                </div>
            `;
            return false;
        }
        return true;
    }

    if (!checkPassword()) {
        throw new Error("Доступ запрещён");
    }
</script>
<div class="container">

    <!-- HEADER -->
    <div class="admin-header">
        <h1>⚙️ COMPASS <em>ARENA</em> · АДМИН-ПАНЕЛЬ</h1>
        <a href="index.html" class="back">← На сайт</a>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab active" data-tab="teams">Команды</button>
        <button class="tab" data-tab="matches">Матчи</button>
        <button class="tab" data-tab="schedule">Расписание</button>
        <button class="tab" data-tab="settings">Настройки</button>
    </div>

    <!-- TAB: TEAMS -->
    <div class="tab-content active" id="tab-teams">
        <div class="card">
            <div class="card-header">
                <h3>➕ Добавить команду</h3>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Название команды</label>
                    <input type="text" id="teamNameInput" placeholder="Team Name" />
                </div>
                <div class="form-group">
                    <label>Игроки (через запятую)</label>
                    <input type="text" id="teamPlayersInput" placeholder="Игрок1, Игрок2, Игрок3, Игрок4, Игрок5" />
                </div>
            </div>
            <button class="btn btn-primary" onclick="addTeam()">➕ Добавить команду</button>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>📋 Список команд</h3>
                <span id="teamsCount" style="color:var(--text-dim);font-size:13px;">0 команд</span>
            </div>
            <div class="team-list" id="teamList"></div>
        </div>
    </div>

    <!-- TAB: MATCHES -->
    <div class="tab-content" id="tab-matches">
        <div class="card">
            <div class="card-header">
                <h3>🏆 Управление матчами</h3>
                <span style="color:var(--text-dim);font-size:13px;">Выберите победителя, чтобы обновить сетку</span>
            </div>
            <div class="match-list" id="matchList"></div>
        </div>
    </div>

    <!-- TAB: SCHEDULE -->
    <div class="tab-content" id="tab-schedule">
        <div class="card">
            <div class="card-header">
                <h3>🕐 Расписание матчей</h3>
            </div>
            <div id="scheduleList"></div>
        </div>
    </div>

    <!-- TAB: SETTINGS -->
    <div class="tab-content" id="tab-settings">
        <div class="card">
            <div class="card-header">
                <h3>⚙️ Настройки турнира</h3>
            </div>
            <div class="form-row three">
                <div class="form-group">
                    <label>Название турнира</label>
                    <input type="text" id="settingsName" value="Compass Arena" />
                </div>
                <div class="form-group">
                    <label>Игра</label>
                    <input type="text" id="settingsGame" value="Dota 2" />
                </div>
                <div class="form-group">
                    <label>Формат матчей</label>
                    <input type="text" id="settingsFormat" value="Bo3" />
                </div>
            </div>
            <div class="form-group" style="margin-bottom:12px;">
                <label>Даты турнира</label>
                <input type="text" id="settingsDates" placeholder="01.06.2026 - 03.06.2026" />
            </div>
            <button class="btn btn-primary" onclick="saveSettings()">💾 Сохранить настройки</button>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>💾 Управление данными</h3>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="exportData()">📤 Экспорт JSON</button>
                <button class="btn" onclick="document.getElementById('importFile').click()">📥 Импорт JSON</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
                <button class="btn btn-danger" onclick="resetData()">🔄 Сбросить всё</button>
            </div>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
    // ============================================================
    // 1. ДАННЫЕ (синхронизация с index.html через localStorage)
    // ============================================================
    let DATA = getDefaultData();

    function getDefaultData() {
        return {
            tournament: {
                name: "Compass Arena",
                game: "Dota 2",
                format: "Double Elimination",
                matches: "Bo3",
                dates: "уточняются"
            },
            teams: [
                { id: 1, name: "Team Spirit", players: ["Yatoro", "Collapse", "Larl", "Mira", "Miposhka"] },
                { id: 2, name: "Virtus.pro", players: ["Nightfall", "gpk", "Noticed", "Save", "Fng"] },
                { id: 3, name: "Team Liquid", players: ["m1CKe", "Nisha", "33", "Boxi", "Insania"] },
                { id: 4, name: "OG", players: ["Yuragi", "bzm", "ATF", "Taiga", "Misha"] },
                { id: 5, name: "Gaimin Gladiators", players: ["dyrachyo", "Quinn", "Ace", "tOfu", "Seleri"] },
                { id: 6, name: "BetBoom Team", players: ["Pure", "gpk", "Nightfall", "Save", "TORONTOTOKYO"] },
                { id: 7, name: "9Pandas", players: ["RAMZES666", "kiyotaka", "MieRo", "Antares", "Solo"] },
                { id: 8, name: "Natus Vincere", players: ["shigetsu", "nefrit", "swedenstrong", "Malady", "Zayac"] }
            ],
            matches: [
                { id: 1, round: 1, team1: 1, team2: 2, winner: null, bracket: 'upper' },
                { id: 2, round: 1, team1: 3, team2: 4, winner: null, bracket: 'upper' },
                { id: 3, round: 1, team1: 5, team2: 6, winner: null, bracket: 'upper' },
                { id: 4, round: 1, team1: 7, team2: 8, winner: null, bracket: 'upper' },
                { id: 5, round: 2, team1: null, team2: null, winner: null, bracket: 'upper' },
                { id: 6, round: 2, team1: null, team2: null, winner: null, bracket: 'upper' },
                { id: 7, round: 3, team1: null, team2: null, winner: null, bracket: 'upper' },
                { id: 8, round: 1, team1: null, team2: null, winner: null, bracket: 'lower' },
                { id: 9, round: 1, team1: null, team2: null, winner: null, bracket: 'lower' },
                { id: 10, round: 2, team1: null, team2: null, winner: null, bracket: 'lower' },
                { id: 11, round: 2, team1: null, team2: null, winner: null, bracket: 'lower' },
                { id: 12, round: 3, team1: null, team2: null, winner: null, bracket: 'lower' },
                { id: 13, round: 4, team1: null, team2: null, winner: null, bracket: 'lower' },
                { id: 14, round: 5, team1: null, team2: null, winner: null, bracket: 'grand' }
            ],
            schedule: {}
        };
    }

    function loadData() {
        try {
            const saved = localStorage.getItem('compassData');
            if (saved) {
                const parsed = JSON.parse(saved);
                // Merge with defaults to keep structure
                DATA = parsed;
                // Ensure all matches exist
                const defaultMatches = getDefaultData().matches;
                const existingIds = DATA.matches.map(m => m.id);
                defaultMatches.forEach(dm => {
                    if (!existingIds.includes(dm.id)) {
                        DATA.matches.push(dm);
                    }
                });
                // Ensure schedule exists
                if (!DATA.schedule) DATA.schedule = {};
                // Ensure tournament exists
                if (!DATA.tournament) DATA.tournament = getDefaultData().tournament;
            }
        } catch(e) {}
        saveData();
    }

    function saveData() {
        try {
            localStorage.setItem('compassData', JSON.stringify(DATA));
        } catch(e) {}
        // Also save to window for index.html
        window.getTournamentData = () => DATA;
        window.renderBracket = () => {};
    }

    // ============================================================
    // 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function getTeam(id) {
        return DATA.teams.find(t => t.id === id) || null;
    }

    function getTeamName(id) {
        const t = getTeam(id);
        return t ? t.name : '—';
    }

    function getMatch(id) {
        return DATA.matches.find(m => m.id === id) || null;
    }

    function getLoser(match) {
        if (!match.winner) return null;
        if (match.team1 === match.winner) return match.team2;
        if (match.team2 === match.winner) return match.team1;
        return null;
    }

    function updateMatchLinks() {
        const m1 = getMatch(1), m2 = getMatch(2), m3 = getMatch(3), m4 = getMatch(4);
        const m5 = getMatch(5), m6 = getMatch(6), m7 = getMatch(7);
        const m8 = getMatch(8), m9 = getMatch(9), m10 = getMatch(10), m11 = getMatch(11), m12 = getMatch(12), m13 = getMatch(13), m14 = getMatch(14);

        if (m5) { m5.team1 = m1 ? m1.winner : null; m5.team2 = m2 ? m2.winner : null; }
        if (m6) { m6.team1 = m3 ? m3.winner : null; m6.team2 = m4 ? m4.winner : null; }
        if (m7) { m7.team1 = m5 ? m5.winner : null; m7.team2 = m6 ? m6.winner : null; }

        if (m8) { m8.team1 = getLoser(m1); m8.team2 = getLoser(m2); }
        if (m9) { m9.team1 = getLoser(m3); m9.team2 = getLoser(m4); }

        if (m10) { m10.team1 = m8 ? m8.winner : null; m10.team2 = getLoser(m5); }
        if (m11) { m11.team1 = m9 ? m9.winner : null; m11.team2 = getLoser(m6); }

        if (m12) { m12.team1 = m10 ? m10.winner : null; m12.team2 = m11 ? m11.winner : null; }

        if (m13) { m13.team1 = m12 ? m12.winner : null; m13.team2 = getLoser(m7); }

        if (m14) { m14.team1 = m7 ? m7.winner : null; m14.team2 = m13 ? m13.winner : null; }
    }

    // ============================================================
    // 3. ОТРИСОВКА
    // ============================================================
    function renderTeams() {
        const container = document.getElementById('teamList');
        const count = document.getElementById('teamsCount');
        if (!container) return;

        container.innerHTML = '';
        DATA.teams.forEach(team => {
            const div = document.createElement('div');
            div.className = 'team-item';
            div.innerHTML = `
                <div class="info">
                    <span class="name">#${team.id} ${team.name}</span>
                    <span class="players">${team.players.join(' · ')}</span>
                </div>
                <div class="actions">
                    <button class="btn btn-sm" onclick="editTeam(${team.id})">✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteTeam(${team.id})">✕</button>
                </div>
            `;
            container.appendChild(div);
        });
        if (count) count.textContent = DATA.teams.length + ' команд';
    }

    function renderMatches() {
        const container = document.getElementById('matchList');
        if (!container) return;

        updateMatchLinks();
        container.innerHTML = '';

        const bracketLabels = {
            upper: 'Верхняя',
            lower: 'Нижняя',
            grand: 'Гранд-финал'
        };
        const bracketClasses = {
            upper: 'upper',
            lower: 'lower',
            grand: 'grand'
        };

        // Sort matches by id
        const sorted = [...DATA.matches].sort((a,b) => a.id - b.id);

        sorted.forEach(m => {
            const t1 = getTeamName(m.team1);
            const t2 = getTeamName(m.team2);
            const winner = m.winner ? getTeamName(m.winner) : '—';
            const isComplete = !!m.winner;

            const div = document.createElement('div');
            div.className = 'match-item';
            div.innerHTML = `
                <div class="teams">
                    <span>${t1}</span>
                    <span class="vs">vs</span>
                    <span>${t2}</span>
                    ${isComplete ? `<span class="winner">→ ${winner}</span>` : ''}
                </div>
                <div class="meta">
                    <span class="bracket-tag ${bracketClasses[m.bracket] || 'upper'}">${bracketLabels[m.bracket] || m.bracket}</span>
                    <span>Раунд ${m.round}</span>
                    ${!isComplete ? `
                        <select onchange="setWinner(${m.id}, this.value)" style="background:var(--bg);border:1px solid var(--line);color:var(--text);padding:4px 8px;border-radius:4px;font-size:12px;">
                            <option value="">Выбрать победителя</option>
                            ${m.team1 ? `<option value="${m.team1}">${getTeamName(m.team1)}</option>` : ''}
                            ${m.team2 ? `<option value="${m.team2}">${getTeamName(m.team2)}</option>` : ''}
                        </select>
                    ` : `
                        <button class="btn btn-sm" onclick="resetMatch(${m.id})">↩️ Сбросить</button>
                    `}
                </div>
            `;
            container.appendChild(div);
        });
    }

    function renderSchedule() {
        const container = document.getElementById('scheduleList');
        if (!container) return;

        container.innerHTML = '';
        const matches = DATA.matches.filter(m => m.team1 && m.team2);

        if (matches.length === 0) {
            container.innerHTML = '<div class="card" style="text-align:center;color:var(--text-dim);">Нет матчей для расписания</div>';
            return;
        }

        matches.forEach(m => {
            const div = document.createElement('div');
            div.className = 'match-item';
            const time = DATA.schedule && DATA.schedule[m.id] ? DATA.schedule[m.id] : '';
            div.innerHTML = `
                <div class="teams">
                    <span>${getTeamName(m.team1)}</span>
                    <span class="vs">vs</span>
                    <span>${getTeamName(m.team2)}</span>
                    ${m.winner ? `<span class="winner">✅</span>` : ''}
                </div>
                <div class="meta">
                    <input type="datetime-local" value="${time}" onchange="setSchedule(${m.id}, this.value)" style="background:var(--bg);border:1px solid var(--line);color:var(--text);padding:4px 8px;border-radius:4px;font-size:12px;"/>
                </div>
            `;
            container.appendChild(div);
        });
    }

    // ============================================================
    // 4. ДЕЙСТВИЯ
    // ============================================================
    function addTeam() {
        const nameInput = document.getElementById('teamNameInput');
        const playersInput = document.getElementById('teamPlayersInput');
        const name = nameInput.value.trim();
        const playersRaw = playersInput.value.trim();

        if (!name) { showToast('Введите название команды'); return; }

        const players = playersRaw ? playersRaw.split(',').map(s => s.trim()).filter(s => s) : [];

        const maxId = DATA.teams.reduce((max, t) => Math.max(max, t.id), 0);
        DATA.teams.push({ id: maxId + 1, name, players });

        nameInput.value = '';
        playersInput.value = '';

        saveData();
        renderTeams();
        renderMatches();
        renderSchedule();
        showToast(`✅ Команда "${name}" добавлена!`);
    }

    function deleteTeam(id) {
        if (!confirm(`Удалить команду #${id}?`)) return;
        DATA.teams = DATA.teams.filter(t => t.id !== id);
        // Also remove from matches
        DATA.matches.forEach(m => {
            if (m.team1 === id) m.team1 = null;
            if (m.team2 === id) m.team2 = null;
            if (m.winner === id) m.winner = null;
        });
        saveData();
        renderTeams();
        renderMatches();
        renderSchedule();
        showToast(`🗑️ Команда удалена`);
    }

    function editTeam(id) {
        const team = getTeam(id);
        if (!team) return;
        const newName = prompt('Новое название команды:', team.name);
        if (newName !== null && newName.trim()) {
            team.name = newName.trim();
            saveData();
            renderTeams();
            renderMatches();
            renderSchedule();
            showToast(`✏️ Команда обновлена`);
        }
    }

    function setWinner(matchId, teamId) {
        const match = getMatch(matchId);
        if (!match) return;
        if (!teamId) return;

        match.winner = parseInt(teamId);
        saveData();
        renderMatches();
        renderSchedule();
        // Update main page if open
        if (window.renderBracket) window.renderBracket();
        showToast(`🏆 Победитель матча #${matchId} выбран!`);
    }

    function resetMatch(matchId) {
        const match = getMatch(matchId);
        if (!match) return;
        if (!confirm(`Сбросить результат матча #${matchId}?`)) return;
        match.winner = null;
        saveData();
        renderMatches();
        renderSchedule();
        if (window.renderBracket) window.renderBracket();
        showToast(`↩️ Результат матча #${matchId} сброшен`);
    }

    function setSchedule(matchId, time) {
        if (!DATA.schedule) DATA.schedule = {};
        DATA.schedule[matchId] = time;
        saveData();
        showToast(`🕐 Время матча #${matchId} сохранено`);
    }

    function saveSettings() {
        const name = document.getElementById('settingsName').value.trim();
        const game = document.getElementById('settingsGame').value.trim();
        const format = document.getElementById('settingsFormat').value.trim();
        const dates = document.getElementById('settingsDates').value.trim();

        DATA.tournament.name = name || 'Compass Arena';
        DATA.tournament.game = game || 'Dota 2';
        DATA.tournament.matches = format || 'Bo3';
        DATA.tournament.dates = dates || 'уточняются';

        saveData();
        showToast('💾 Настройки сохранены!');
    }

    // ============================================================
    // 5. ЭКСПОРТ / ИМПОРТ
    // ============================================================
    function exportData() {
        const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'compass_data.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('📤 Данные экспортированы');
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                DATA = data;
                saveData();
                renderTeams();
                renderMatches();
                renderSchedule();
                showToast('📥 Данные импортированы!');
            } catch(err) {
                showToast('❌ Ошибка импорта: неверный JSON');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function resetData() {
        if (!confirm('⚠️ Сбросить все данные? Это действие необратимо!')) return;
        if (!confirm('Точно?')) return;
        DATA = getDefaultData();
        saveData();
        renderTeams();
        renderMatches();
        renderSchedule();
        showToast('🔄 Все данные сброшены');
    }

    // ============================================================
    // 6. TOAST
    // ============================================================
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    // ============================================================
    // 7. TABS
    // ============================================================
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const target = document.getElementById('tab-' + this.dataset.tab);
            if (target) target.classList.add('active');
            // Refresh content on tab switch
            if (this.dataset.tab === 'matches') renderMatches();
            if (this.dataset.tab === 'schedule') renderSchedule();
        });
    });

    // ============================================================
    // 8. ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    loadData();

    // Load settings
    document.getElementById('settingsName').value = DATA.tournament.name || 'Compass Arena';
    document.getElementById('settingsGame').value = DATA.tournament.game || 'Dota 2';
    document.getElementById('settingsFormat').value = DATA.tournament.matches || 'Bo3';
    document.getElementById('settingsDates').value = DATA.tournament.dates || '';

    renderTeams();
    renderMatches();
    renderSchedule();

    // Expose functions to window
    window.addTeam = addTeam;
    window.deleteTeam = deleteTeam;
    window.editTeam = editTeam;
    window.setWinner = setWinner;
    window.resetMatch = resetMatch;
    window.setSchedule = setSchedule;
    window.saveSettings = saveSettings;
    window.exportData = exportData;
    window.importData = importData;
    window.resetData = resetData;
    window.showToast = showToast;
    window.getTournamentData = () => DATA;
    window.renderBracket = () => {};

    console.log('✅ Admin panel loaded!');
    console.log('📊 Data:', DATA);
</script>

</body>
</html>
