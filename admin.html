<script>
// ⚠️ ЭТО ХЕШ ПАРОЛЯ "compass2026"
// Если хотите сменить пароль — раскомментируйте код ниже,
// введите новый пароль, скопируйте новый хеш и замените HASH.
var PASSWORD_HASH = "d0e6d8e5e4c4f4f8e6e0d8e4e4e2d0e6d8e5e4c4f4f8e6e0d8e4e4e2";

// ============================================================
// ФУНКЦИЯ ХЕШИРОВАНИЯ (простая, но надёжная)
// ============================================================
function hashPassword(password) {
    var hash = 0;
    for (var i = 0; i < password.length; i++) {
        var char = password.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash; // Преобразование в 32-битное целое
    }
    return hash.toString(16);
}

// ============================================================
// ГЕНЕРАЦИЯ НОВОГО ХЕША (раскомментируйте для смены пароля)
// ============================================================
/*

console.log("НОВЫЙ ХЕШ ПАРОЛЯ: " + newHash);
// Скопируйте этот хеш в PASSWORD_HASH выше
*/

// ============================================================
// ПРОВЕРКА ПАРОЛЯ
// ============================================================
function checkPassword() {
    var input = prompt("🔐 Введите пароль администратора:");
    if (input === null) {
        // Пользователь нажал "Отмена"
        document.body.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0d12;color:#5f6773;font-family:sans-serif;flex-direction:column;gap:16px;text-align:center;padding:20px;">
                <h1 style="font-size:48px;">🔒</h1>
                <h2>Доступ отменён</h2>
            </div>
        `;
        return false;
    }
    
    var inputHash = hashPassword(input);
    if (inputHash !== PASSWORD_HASH) {
        document.body.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0d12;color:#e74c3c;font-family:sans-serif;flex-direction:column;gap:16px;text-align:center;padding:20px;">

                <h2>Доступ запрещён</h2>
                <p style="color:#97a0ac;">Неверный пароль администратора</p>
                <button onclick="location.reload()" style="padding:10px 30px;background:#c9a35a;border:none;border-radius:4px;color:#0a0d12;cursor:pointer;font-size:16px;">Попробовать снова</button>
            </div>
        `;
        return false;
    }
    return true;
}

// Запускаем проверку
if (!checkPassword()) {
    throw new Error("Доступ запрещён");
}
</script>

<script>
// ============================================================
// ФУНКЦИЯ СМЕНЫ ПАРОЛЯ
// ============================================================
function changePassword() {
    var newPass = prompt("Введите НОВЫЙ пароль администратора (минимум 6 символов):");
    if (!newPass || newPass.length < 6) {
        showToast("❌ Пароль должен быть минимум 6 символов");
        return;
    }
    var confirmPass = prompt("Повторите новый пароль:");
    if (newPass !== confirmPass) {
        showToast("❌ Пароли не совпадают");
        return;
    }
    var newHash = hashPassword(newPass);
    var sure = confirm("⚠️ ВНИМАНИЕ! Вы собираетесь сменить пароль.\n\nНовый пароль: " + newPass + "\n\nЗапомните его! После смены старый пароль перестанет работать.\n\nПродолжить?");
    if (!sure) return;
    
    // Сохраняем новый хеш в localStorage
    try {
        localStorage.setItem('adminPasswordHash', newHash);
        showToast("✅ Пароль успешно изменён! Запомните: " + newPass);
        // Перезагружаем страницу для применения нового пароля
        setTimeout(function() { location.reload(); }, 1500);
    } catch(e) {
        showToast("❌ Ошибка сохранения пароля");
    }
}

// ============================================================
// ФУНКЦИЯ ХЕШИРОВАНИЯ
// ============================================================
function hashPassword(password) {
    var hash = 0;
    for (var i = 0; i < password.length; i++) {
        var char = password.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
    }
    return hash.toString(16);
}

// ============================================================
// ЗАГРУЗКА ХЕША ИЗ LOCALSTORAGE (если есть)
// ============================================================
function loadPasswordHash() {
    try {
        var saved = localStorage.getItem('adminPasswordHash');
        if (saved && saved.length > 0) {
            return saved;
        }
    } catch(e) {}
    return null;
}

// ============================================================
// ПРОВЕРКА ПАРОЛЯ (с поддержкой смены)
// ============================================================
function checkPassword() {
    // Проверяем, есть ли сохранённый хеш в localStorage
    var savedHash = loadPasswordHash();
    var currentHash = savedHash || PASSWORD_HASH;
    
    var input = prompt("🔐 Введите пароль администратора:");
    if (input === null) {
        document.body.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0d12;color:#5f6773;font-family:sans-serif;flex-direction:column;gap:16px;text-align:center;padding:20px;">
                <h1 style="font-size:48px;">🔒</h1>
                <h2>Доступ отменён</h2>
            </div>
        `;
        return false;
    }
    
    var inputHash = hashPassword(input);
    if (inputHash !== currentHash) {
        document.body.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0d12;color:#e74c3c;font-family:sans-serif;flex-direction:column;gap:16px;text-align:center;padding:20px;">
                <h1 style="font-size:48px;">⛔</h1>
                <h2>Доступ запрещён</h2>
                <p style="color:#97a0ac;">Неверный пароль администратора</p>
                <button onclick="location.reload()" style="padding:10px 30px;background:#c9a35a;border:none;border-radius:4px;color:#0a0d12;cursor:pointer;font-size:16px;">Попробовать снова</button>
            </div>
        `;
        return false;
    }
    return true;
}

// ============================================================
// ДАННЫЕ
// ============================================================
var DATA = getDefaultData();

function getDefaultData() {
    return {
        tournament: { name: "Compass Arena", game: "Dota 2", format: "Double Elimination", matches: "Bo3", dates: "уточняются" },
        teams: [
            { id: 1, name: "Team Spirit", players: ["Yatoro", "Collapse", "Larl", "Mira", "Miposhka"] },
            { id: 2, name: "Virtus.pro", players: ["Nightfall", "gpk", "Noticed", "Save", "Fng"] },
            { id: 3, name: "Team Liquid", players: ["m1CKe", "Nisha", "33", "Boxi", "Insania"] },
            { id: 4, name: "OG", players: ["Yuragi", "bzm", "ATF", "Taiga", "Misha"] },
            { id: 5, name: "Gaimin Gladiators", players: ["dyrachyo", "Quinn", "Ace", "tOfu", "Seleri"] },
            { id: 6, name: "BetBoom Team", players: ["Pure", "gpk", "Nightfall", "Save", "TORONTOTOKYO"] },
            { id: 7, name: "9Pandas", players: ["RAMZES666", "kiyotaka", "MieRo", "Antares", "Solo"] },
            { id: 8, name: "Natus Vincere", players: ["shigetsu", "nefrit", "swedenstrong", "Malady", "Zayac"] }
        ],
        matches: [
            { id: 1, round: 1, team1: 1, team2: 2, winner: null, bracket: 'upper' },
            { id: 2, round: 1, team1: 3, team2: 4, winner: null, bracket: 'upper' },
            { id: 3, round: 1, team1: 5, team2: 6, winner: null, bracket: 'upper' },

            { id: 6, round: 2, team1: null, team2: null, winner: null, bracket: 'upper' },
            { id: 7, round: 3, team1: null, team2: null, winner: null, bracket: 'upper' },
            { id: 8, round: 1, team1: null, team2: null, winner: null, bracket: 'lower' },
            { id: 9, round: 1, team1: null, team2: null, winner: null, bracket: 'lower' },
            { id: 10, round: 2, team1: null, team2: null, winner: null, bracket: 'lower' },
            { id: 11, round: 2, team1: null, team2: null, winner: null, bracket: 'lower' },
            { id: 12, round: 3, team1: null, team2: null, winner: null, bracket: 'lower' },
            { id: 13, round: 4, team1: null, team2: null, winner: null, bracket: 'lower' },
            { id: 14, round: 5, team1: null, team2: null, winner: null, bracket: 'grand' }
        ],
        schedule: {}
    };
}

// ============================================================
// ЗАГРУЗКА/СОХРАНЕНИЕ
// ============================================================
function loadData() {
    try {
        var saved = localStorage.getItem('compassData');
        if (saved) {
            var parsed = JSON.parse(saved);
            DATA = parsed;
            var defaultMatches = getDefaultData().matches;
            var ids = DATA.matches.map(function(m) { return m.id; });
            for (var i = 0; i < defaultMatches.length; i++) {
                if (ids.indexOf(defaultMatches[i].id) === -1) DATA.matches.push(defaultMatches[i]);
            }
            if (!DATA.schedule) DATA.schedule = {};
            if (!DATA.tournament) DATA.tournament = getDefaultData().tournament;
        }
    } catch(e) {}
    saveData();
}

function saveData() {
    try { localStorage.setItem('compassData', JSON.stringify(DATA)); } catch(e) {}
}

// ============================================================
// ВСПОМОГАТЕЛЬНЫЕ
// ============================================================
function getTeam(id) {
    for (var i = 0; i < DATA.teams.length; i++) {
        if (DATA.teams[i].id === id) return DATA.teams[i];
    }
    return null;
}

function getTeamName(id) {
    var t = getTeam(id);
    return t ? t.name : '—';
}

function getMatch(id) {
    for (var i = 0; i < DATA.matches.length; i++) {
        if (DATA.matches[i].id === id) return DATA.matches[i];
    }
    return null;
}

function getLoser(m) {
    if (!m.winner) return null;
    if (m.team1 === m.winner) return m.team2;
    if (m.team2 === m.winner) return m.team1;
    return null;
}

function updateMatchLinks() {
    var m1 = getMatch(1), m2 = getMatch(2), m3 = getMatch(3), m4 = getMatch(4);
    var m5 = getMatch(5), m6 = getMatch(6), m7 = getMatch(7);
    var m8 = getMatch(8), m9 = getMatch(9), m10 = getMatch(10), m11 = getMatch(11);
    var m12 = getMatch(12), m13 = getMatch(13), m14 = getMatch(14);
    if (m5) { m5.team1 = m1 ? m1.winner : null; m5.team2 = m2 ? m2.winner : null; }
    if (m6) { m6.team1 = m3 ? m3.winner : null; m6.team2 = m4 ? m4.winner : null; }
    if (m7) { m7.team1 = m5 ? m5.winner : null; m7.team2 = m6 ? m6.winner : null; }
    if (m8) { m8.team1 = getLoser(m1); m8.team2 = getLoser(m2); }
    if (m9) { m9.team1 = getLoser(m3); m9.team2 = getLoser(m4); }
    if (m10) { m10.team1 = m8 ? m8.winner : null; m10.team2 = getLoser(m5); }
    if (m11) { m11.team1 = m9 ? m9.winner : null; m11.team2 = getLoser(m6); }
    if (m12) { m12.team1 = m10 ? m10.winner : null; m12.team2 = m11 ? m11.winner : null; }
    if (m13) { m13.team1 = m12 ? m12.winner : null; m13.team2 = getLoser(m7); }
    if (m14) { m14.team1 = m7 ? m7.winner : null; m14.team2 = m13 ? m13.winner : null; }
}

// ============================================================
// ОТРИСОВКА
// ============================================================
function renderTeams() {
    var container = document.getElementById('teamList');
    var count = document.getElementById('teamsCount');
    if (!container) return;
    container.innerHTML = '';
    for (var i = 0; i < DATA.teams.length; i++) {
        var t = DATA.teams[i];
        var div = document.createElement('div');
        div.className = 'team-item';
        div.innerHTML = '<div class="info"><span class="name">#' + t.id + ' ' + t.name + '</span><span class="players">' + t.players.join(' · ') + '</span></div><div class="actions"><button class="btn btn-sm" onclick="editTeam(' + t.id + ')">✏️</button><button class="btn btn-sm btn-danger" onclick="deleteTeam(' + t.id + ')">✕</button></div>';
        container.appendChild(div);
    }
    if (count) count.textContent = DATA.teams.length + ' команд';
}

function renderMatches() {
    var container = document.getElementById('matchList');
    if (!container) return;
    updateMatchLinks();
    container.innerHTML = '';
    var labels = { upper: 'Верхняя', lower: 'Нижняя', grand: 'Гранд-финал' };
    var classes = { upper: 'upper', lower: 'lower', grand: 'grand' };
    var sorted = DATA.matches.slice().sort(function(a,b){return a.id - b.id;});
    for (var i = 0; i < sorted.length; i++) {
        var m = sorted[i];
        var t1 = getTeamName(m.team1);
        var t2 = getTeamName(m.team2);
        var winner = m.winner ? getTeamName(m.winner) : '—';
        var isComplete = !!m.winner;
        var div = document.createElement('div');
        div.className = 'match-item';
        var selectHtml = '';
        if (!isComplete) {
            selectHtml = '<select onchange="setWinner(' + m.id + ', this.value)" style="background:#0a0d12;border:1px solid #242b35;color:#eae6da;padding:2px 6px;border-radius:4px;font-size:11px;"><option value="">Выбрать</option>';
            if (m.team1) selectHtml += '<option value="' + m.team1 + '">' + getTeamName(m.team1) + '</option>';
            if (m.team2) selectHtml += '<option value="' + m.team2 + '">' + getTeamName(m.team2) + '</option>';
            selectHtml += '</select>';
        } else {
            selectHtml = '<button class="btn btn-sm" onclick="resetMatch(' + m.id + ')">↩️ Сбросить</button>';
        }
        var label = labels[m.bracket] || m.bracket;
        var cls = classes[m.bracket] || 'upper';
        div.innerHTML = '<div class="teams"><span>' + t1 + '</span><span class="vs">vs</span><span>' + t2 + '</span>' + (isComplete ? '<span class="winner">→ ' + winner + '</span>' : '') + '</div><div class="meta"><span class="tag ' + cls + '">' + label + '</span><span>Раунд ' + m.round + '</span>' + selectHtml + '</div>';
        container.appendChild(div);
    }
}

function renderSchedule() {
    var container = document.getElementById('scheduleList');
    if (!container) return;
    container.innerHTML = '';
    var matches = [];
    for (var i = 0; i < DATA.matches.length; i++) {
        if (DATA.matches[i].team1 && DATA.matches[i].team2) matches.push(DATA.matches[i]);
    }
    if (matches.length === 0) {
        container.innerHTML = '<div class="card" style="text-align:center;color:#5f6773;">Нет матчей</div>';
        return;
    }
    for (var i = 0; i < matches.length; i++) {
        var m = matches[i];
        var time = (DATA.schedule && DATA.schedule[m.id]) ? DATA.schedule[m.id] : '';
        var div = document.createElement('div');
        div.className = 'match-item';
        div.innerHTML = '<div class="teams"><span>' + getTeamName(m.team1) + '</span><span class="vs">vs</span><span>' + getTeamName(m.team2) + '</span>' + (m.winner ? '<span class="winner">✅</span>' : '') + '</div><div class="meta"><input type="datetime-local" value="' + time + '" onchange="setSchedule(' + m.id + ', this.value)" style="background:#0a0d12;border:1px solid #242b35;color:#eae6da;padding:3px 6px;border-radius:4px;font-size:11px;"/></div>';
        container.appendChild(div);
    }
}

// ============================================================
// ДЕЙСТВИЯ
// ============================================================
function addTeam() {
    var nameInput = document.getElementById('teamNameInput');
    var playersInput = document.getElementById('teamPlayersInput');
    var name = nameInput.value.trim();
    var playersRaw = playersInput.value.trim();
    if (!name) { showToast('Введите название'); return; }
    var players = playersRaw ? playersRaw.split(',').map(function(s){return s.trim();}).filter(function(s){return s;}) : [];
    var maxId = 0;
    for (var i = 0; i < DATA.teams.length; i++) {
        if (DATA.teams[i].id > maxId) maxId = DATA.teams[i].id;
    }
    DATA.teams.push({ id: maxId + 1, name: name, players: players });
    nameInput.value = '';
    playersInput.value = '';
    saveData();
    renderTeams();
    renderMatches();
    renderSchedule();
    showToast('✅ Команда "' + name + '" добавлена!');
}

function deleteTeam(id) {
    if (!confirm('Удалить команду #' + id + '?')) return;
    var newTeams = [];
    for (var i = 0; i < DATA.teams.length; i++) {
        if (DATA.teams[i].id !== id) newTeams.push(DATA.teams[i]);
    }
    DATA.teams = newTeams;
    for (var j = 0; j < DATA.matches.length; j++) {
        if (DATA.matches[j].team1 === id) DATA.matches[j].team1 = null;
        if (DATA.matches[j].team2 === id) DATA.matches[j].team2 = null;
        if (DATA.matches[j].winner === id) DATA.matches[j].winner = null;
    }
    saveData();
    renderTeams();
    renderMatches();
    renderSchedule();
    showToast('🗑️ Команда удалена');
}

function editTeam(id) {
    var team = getTeam(id);
    if (!team) return;
    var newName = prompt('Новое название:', team.name);
    if (newName !== null && newName.trim()) {
        team.name = newName.trim();
        saveData();
        renderTeams();
        renderMatches();
        renderSchedule();
        showToast('✏️ Команда обновлена');
    }
}

function setWinner(matchId, teamId) {
    var match = getMatch(matchId);
    if (!match || !teamId) return;
    match.winner = parseInt(teamId, 10);
    saveData();
    renderMatches();
    renderSchedule();
    if (window.renderBracket) window.renderBracket();
    showToast('🏆 Победитель матча #' + matchId + ' выбран!');
}

function resetMatch(matchId) {
    var match = getMatch(matchId);
    if (!match) return;
    if (!confirm('Сбросить результат матча #' + matchId + '?')) return;
    match.winner = null;
    saveData();
    renderMatches();
    renderSchedule();
    if (window.renderBracket) window.renderBracket();
    showToast('↩️ Результат матча #' + matchId + ' сброшен');
}

function setSchedule(matchId, time) {
    if (!DATA.schedule) DATA.schedule = {};
    DATA.schedule[matchId] = time;
    saveData();
    showToast('🕐 Время матча #' + matchId + ' сохранено');
}

function saveSettings() {
    var name = document.getElementById('settingsName').value.trim();
    var game = document.getElementById('settingsGame').value.trim();
    var format = document.getElementById('settingsFormat').value.trim();
    var dates = document.getElementById('settingsDates').value.trim();
    DATA.tournament.name = name || 'Compass Arena';
    DATA.tournament.game = game || 'Dota 2';
    DATA.tournament.matches = format || 'Bo3';
    DATA.tournament.dates = dates || 'уточняются';
    saveData();
    showToast('💾 Настройки сохранены!');
}

function exportData() {
    var blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'compass_data.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('📤 Данные экспортированы');
}

function importData(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = JSON.parse(e.target.result);
            DATA = data;
            saveData();
            renderTeams();
            renderMatches();
            renderSchedule();
            showToast('📥 Данные импортированы!');
        } catch(err) {
            showToast('❌ Ошибка импорта');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function resetData() {
    if (!confirm('⚠️ Сбросить все данные?')) return;
    if (!confirm('Точно?')) return;
    DATA = getDefaultData();
    saveData();
    renderTeams();
    renderMatches();
    renderSchedule();
    showToast('🔄 Данные сброшены');
}

function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(function() { el.classList.remove('show'); }, 3000);
}

// ============================================================
// TABS
// ============================================================
var tabs = document.querySelectorAll('.tab');
for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function() {
        var allTabs = document.querySelectorAll('.tab');
        for (var j = 0; j < allTabs.length; j++) allTabs[j].classList.remove('active');
        var allContent = document.querySelectorAll('.tab-content');
        for (var k = 0; k < allContent.length; k++) allContent[k].classList.remove('active');
        this.classList.add('active');
        var target = document.getElementById('tab-' + this.dataset.tab);
        if (target) target.classList.add('active');
        if (this.dataset.tab === 'matches') renderMatches();
        if (this.dataset.tab === 'schedule') renderSchedule();
    });
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
loadData();
document.getElementById('settingsName').value = DATA.tournament.name || 'Compass Arena';
document.getElementById('settingsGame').value = DATA.tournament.game || 'Dota 2';
document.getElementById('settingsFormat').value = DATA.tournament.matches || 'Bo3';
document.getElementById('settingsDates').value = DATA.tournament.dates || '';
renderTeams();
renderMatches();
renderSchedule();

// Экспортируем функции
window.addTeam = addTeam;
window.deleteTeam = deleteTeam;
window.editTeam = editTeam;
window.setWinner = setWinner;
window.resetMatch = resetMatch;
window.setSchedule = setSchedule;
window.saveSettings = saveSettings;
window.exportData = exportData;
window.importData = importData;
window.resetData = resetData;
window.showToast = showToast;
window.changePassword = changePassword;
window.getTournamentData = function() { return DATA; };
window.renderBracket = function() {};

console.log('✅ Admin panel loaded!');
</script>
</body>
</html>
